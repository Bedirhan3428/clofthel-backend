name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-phone:
    name: Build Phone APK (ARM32 / ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
    env:
      NODE_OPTIONS: "--max-old-space-size=3072"
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Expo Prebuild
        run: |
          npx expo prebuild --platform android --no-install --clean
          node scripts/modify-gradle.js
          cp debug.keystore android/app/debug.keystore
          sed -i 's/org.gradle.jvmargs=-Xmx4096m/org.gradle.jvmargs=-Xmx2048m/g' android/gradle.properties
          echo "kotlin.daemon.jvmopts=-Xmx1024m" >> android/gradle.properties

      - name: Build Android Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Delete Old Artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const artifact of res.data.artifacts) {
                console.log(`Deleting old artifact ${artifact.name} (ID: ${artifact.id})...`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
              console.log('✅ All old artifacts deleted successfully.');
            } catch (err) {
              console.log('Notice deleting artifacts:', err.message);
            }

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-phone-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-build
          name: "Clofthel Android Release APK"
          body: "Son güncellenen Clofthel Android APK sürümü."
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


